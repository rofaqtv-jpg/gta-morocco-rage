name: Build GTA RAGE
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: android-actions/setup-android@v4
      - name: Create MINIMAL Project (100% works)
        run: |
          mkdir -p app/src/main/java/com/turrinistudio/gtav
          mkdir -p app/src/main/res/values
          mkdir -p.github/workflows

          cat > gradle.properties << 'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx4g
          EOF

          cat > settings.gradle.kts << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "GTA Morocco"
          include(":app")
          EOF

          cat > build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF

          cat > app/build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.turrinistudio.gtav"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.turrinistudio.gtav"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 2
                  versionName = "0.2-UI"
              }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
          }
          EOF

          cat > app/src/main/res/values/themes.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.GTA" parent="android:Theme.Material.Light.NoActionBar" />
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:label="GTA Morocco" android:theme="@style/Theme.GTA">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/turrinistudio/gtav/MainActivity.kt << 'EOF'
          package com.turrinistudio.gtav
          import android.os.Bundle
          import android.widget.TextView
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val tv = TextView(this)
                  tv.text = "GTA MOROCCO\n\nRAGE Engine - Private Build\n\nTangier 2026\n\nApp works 100%!"
                  tv.textSize = 24f
                  tv.setPadding(50, 300, 50, 50)
                  tv.textAlignment = TextView.TEXT_ALIGNMENT_CENTER
                  setContentView(tv)
              }
          }
          EOF

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4
      - run: |
          rm -rf gradlew gradle/wrapper
          gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: GTA-APK-FIXED
          path: '**/*.apk'
