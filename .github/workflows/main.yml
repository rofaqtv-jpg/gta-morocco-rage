name: Build GTA NIGHT CHASE
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin' }
      - uses: android-actions/setup-android@v4
      - name: Build v1.2 Night Police
        run: |
          mkdir -p app/src/main/java/com/turrinistudio/gtav
          cat > settings.gradle.kts << 'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "GTA Tangier"
          include(":app")
          EOF
          cat > build.gradle.kts << 'EOF'
          plugins { id("com.android.application") version "8.2.2" apply false }
          EOF
          cat > app/build.gradle.kts << 'EOF'
          plugins { id("com.android.application") }
          android {
              namespace = "com.turrinistudio.gtav"
              compileSdk = 33
              defaultConfig {
                  applicationId = "com.turrinistudio.gtav"
                  minSdk = 21
                  targetSdk = 33
                  versionCode = 12
                  versionName = "1.2-NIGHT"
              }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:label="GTA Tangier NIGHT" android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                  <activity android:name=".MainActivity" android:exported="true" android:screenOrientation="landscape">
                      <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/turrinistudio/gtav/MainActivity.java << 'ENDOFFILE'
          package com.turrinistudio.gtav;
          import android.app.Activity;
          import android.opengl.GLSurfaceView;
          import android.os.Bundle;
          import android.widget.FrameLayout;
          import android.widget.TextView;
          import android.view.MotionEvent;
          import android.graphics.Color;
          import javax.microedition.khronos.egl.EGLConfig;
          import javax.microedition.khronos.opengles.GL10;
          import java.nio.ByteBuffer;
          import java.nio.ByteOrder;
          import java.nio.FloatBuffer;
          import java.util.ArrayList;
          import java.util.List;
          import java.util.Random;

          public class MainActivity extends Activity {
              float carX=0, carZ=0, carRot=0, speed=0, drift=0;
              boolean gas=false, brake=false, left=false, right=false;
              List<float[]> buildings = new ArrayList<>();
              List<float[]> traffic = new ArrayList<>();
              float policeX=-30, policeZ=-30, policeRot=0;
              int wanted=0, wantedTimer=0;
              Random rnd = new Random();
              TextView hud;
              int frame=0;

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  buildings.clear(); traffic.clear();
                  for(int i=-25;i<=25;i++) for(int j=0;j<5;j++) if(!(i==0&&j==0) && rnd.nextFloat()>0.25f) buildings.add(new float[]{i*9, j*9+15, 3.5f, 3+rnd.nextInt(5)});
                  for(int i=0;i<12;i++) traffic.add(new float[]{(rnd.nextFloat()-0.5f)*150, rnd.nextFloat()*100-20, 0.2f+rnd.nextFloat()*0.2f, rnd.nextInt(4)});

                  GLSurfaceView glView = new GLSurfaceView(this);
                  glView.setRenderer(new GLSurfaceView.Renderer() {
                      FloatBuffer buf;
                      public void onSurfaceCreated(GL10 gl, EGLConfig c) {
                          gl.glClearColor(0.02f, 0.03f, 0.15f, 1f);
                          gl.glEnable(GL10.GL_DEPTH_TEST);
                          float[] v = {-0.5f,-0.5f,0.5f,0.5f,-0.5f,0.5f,-0.5f,0.5f,0.5f,0.5f,0.5f,0.5f,0.5f,-0.5f,-0.5f,-0.5f,-0.5f,-0.5f,0.5f,0.5f,-0.5f,-0.5f,0.5f,-0.5f,-0.5f,-0.5f,-0.5f,-0.5f,-0.5f,0.5f,-0.5f,0.5f,-0.5f,-0.5f,0.5f,0.5f,0.5f,-0.5f,0.5f,0.5f,-0.5f,-0.5f,0.5f,0.5f,0.5f,0.5f,0.5f,-0.5f,-0.5f,0.5f,0.5f,0.5f,0.5f,0.5f,-0.5f,0.5f,-0.5f,-0.5f,-0.5f,-0.5f,0.5f,-0.5f,-0.5f,-0.5f,-0.5f,0.5f,0.5f,-0.5f,0.5f};
                          ByteBuffer bb = ByteBuffer.allocateDirect(v.length*4); bb.order(ByteOrder.nativeOrder()); buf=bb.asFloatBuffer(); buf.put(v); buf.position(0);
                      }
                      public void onSurfaceChanged(GL10 gl, int w, int h) {
                          gl.glViewport(0,0,w,h); gl.glMatrixMode(GL10.GL_PROJECTION); gl.glLoadIdentity(); gl.glFrustumf(-(float)w/h*0.8f,(float)w/h*0.8f,-0.8f,0.8f,1.2f,200);
                      }
                      public void onDrawFrame(GL10 gl) {
                          frame++;
                          float accel=0; if(gas) accel+=0.025f; if(brake) accel-=0.035f; speed+=accel; speed*=0.991f; if(speed>0.7f)speed=0.7f; if(speed<-0.35f)speed=-0.35f;
                          float turn=Math.abs(speed)*5.5f; if(Math.abs(speed)<0.05f) turn=0;
                          if(left){carRot+=turn; drift+=0.12f;} if(right){carRot-=turn; drift-=0.12f;} drift*=0.90f;
                          float nx=carX+(float)Math.sin(Math.toRadians(carRot+drift*12))*speed; float nz=carZ+(float)Math.cos(Math.toRadians(carRot+drift*12))*speed;
                          boolean col=false; for(float[] bl:buildings) if(Math.abs(nx-bl[0])<bl[2]/2+1.5f && Math.abs(nz-bl[1])<bl[2]/2+1.5f){col=true;break;}
                          for(float[] t:traffic) if(Math.abs(nx-t[0])<1.8f && Math.abs(nz-t[1])<1.8f){col=true;speed*=-0.5f;break;}
                          if(Math.abs(nx-policeX)<2f && Math.abs(nz-policeZ)<2f){col=true; speed*=-0.8f; wanted=3;}
                          if(!col){carX=nx;carZ=nz;}

                          // Wanted system
                          if(Math.abs(speed)>0.55f) wantedTimer++; else wantedTimer=Math.max(0,wantedTimer-1);
                          if(wantedTimer>150) wanted=Math.min(3,wanted+1);
                          if(wanted>0){
                              float dx=carX-policeX, dz=carZ-policeZ; float dist=(float)Math.sqrt(dx*dx+dz*dz);
                              policeRot=(float)Math.toDegrees(Math.atan2(dx,dz));
                              float pSpeed=0.28f + wanted*0.08f;
                              policeX+=(float)Math.sin(Math.toRadians(policeRot))*pSpeed;
                              policeZ+=(float)Math.cos(Math.toRadians(policeRot))*pSpeed;
                              if(dist>80){wanted--; wantedTimer=0;}
                          }

                          for(float[] t:traffic){t[0]+=(float)Math.sin(Math.toRadians(t[3]*90))*t[2]; t[1]+=(float)Math.cos(Math.toRadians(t[3]*90))*t[2]; if(t[0]>80)t[0]=-80; if(t[0]<-80)t[0]=80; if(t[1]>110)t[1]=-30; if(t[1]<-30)t[1]=110;}

                          if(frame%8==0){final int kmh=(int)(Math.abs(speed)*320); final int w=wanted; final String stars=w==0?"": (w==1?"★":w==2?"★★":"★★★"); final String dr=Math.abs(drift)>0.6f?" DRIFT!!!":""; runOnUiThread(()->{if(hud!=null) hud.setText("GTA TANGIER NIGHT v1.2\n"+kmh+" KM/H "+dr+"\nWANTED: "+stars+"\n"+(w>0?"POLICE CHASING YOU!":"")+"\n\n[GAS] left-up [BRAKE] left-down [◀▶] right");});}

                          gl.glClear(GL10.GL_COLOR_BUFFER_BIT|GL10.GL_DEPTH_BUFFER_BIT);
                          gl.glMatrixMode(GL10.GL_MODELVIEW); gl.glLoadIdentity();
                          gl.glTranslatef(0,-2.2f,-8.5f); gl.glRotatef(18,1,0,0); gl.glRotatef(-carRot,0,1,0); gl.glTranslatef(-carX,0,-carZ);

                          gl.glPushMatrix(); gl.glTranslatef(0,-0.7f,-55); drawCube(gl,400,0.2f,120,0.02f,0.15f,0.45f); gl.glPopMatrix();
                          gl.glPushMatrix(); gl.glTranslatef(0,-0.5f,0); drawCube(gl,300,0.4f,18,0.1f,0.1f,0.1f); gl.glPopMatrix();
                          gl.glPushMatrix(); gl.glTranslatef(0,-0.28f,0); drawCube(gl,0.6f,0.03f,300,1f,0.9f,0.15f); gl.glPopMatrix();
                          gl.glPushMatrix(); gl.glTranslatef(0,-0.6f,-14); drawCube(gl,300,0.25f,12,0.15f,0.12f,0.08f); gl.glPopMatrix();

                          for(float[] bl:buildings){gl.glPushMatrix(); gl.glTranslatef(bl[0],bl[3]/2-0.5f,bl[1]); drawCube(gl,bl[2],bl[3],bl[2],0.12f,0.12f,0.14f);
                              boolean lightOn=rnd.nextFloat()>0.4f; gl.glPushMatrix(); gl.glTranslatef(0,0,bl[2]/2+0.02f); drawCube(gl,bl[2]*0.7f,bl[3]*0.6f,0.02f,lightOn?1f:0.2f,lightOn?0.9f:0.2f,lightOn?0.3f:0.25f); gl.glPopMatrix(); gl.glPopMatrix();}

                          for(float[] t:traffic){gl.glPushMatrix(); gl.glTranslatef(t[0],0.25f,t[1]); gl.glRotatef(t[3]*90,0,1,0); float r=0.2f,g=0.3f,b=0.9f; if(t[3]==1){r=1f;g=0.9f;b=0.1f;} else if(t[3]==2){r=0.2f;g=0.85f;b=0.3f;} else if(t[3]==3){r=0.9f;g=0.9f;b=0.9f;} drawCube(gl,1.3f,0.6f,2.4f,r,g,b); gl.glPopMatrix();}

                          // Police car
                          if(wanted>0){gl.glPushMatrix(); gl.glTranslatef(policeX,0.35f,policeZ); gl.glRotatef(policeRot,0,1,0); drawCube(gl,1.4f,0.7f,2.6f,0.05f,0.05f,0.9f); gl.glPushMatrix(); gl.glTranslatef(0,0.5f,0); drawCube(gl,0.8f,0.3f,0.8f,frame%10<5?1f:0f,0f,frame%10>=5?1f:0f); gl.glPopMatrix(); gl.glPopMatrix();}

                          // Player car + headlights
                          gl.glPushMatrix(); gl.glTranslatef(carX,0.4f,carZ); gl.glRotatef(carRot,0,1,0);
                          if(Math.abs(drift)>0.3f){gl.glPushMatrix(); gl.glTranslatef(0,-0.45f,0); drawCube(gl,2f,0.06f,3f,Math.abs(drift)>0.6f?1f:0.2f,0.2f,1f); gl.glPopMatrix();}
                          drawCube(gl,1.5f,0.65f,2.8f,1f,0.08f,0.12f);
                          gl.glPushMatrix(); gl.glTranslatef(-0.5f,0.1f,1.4f); drawCube(gl,0.3f,0.2f,0.1f,1f,1f,0.8f); gl.glPopMatrix();
                          gl.glPushMatrix(); gl.glTranslatef(0.5f,0.1f,1.4f); drawCube(gl,0.3f,0.2f,0.1f,1f,1f,0.8f); gl.glPopMatrix();
                          gl.glPushMatrix(); gl.glTranslatef(0,0.55f,-0.15f); drawCube(gl,1.25f,0.5f,1.3f,0.05f,0.05f,0.12f); gl.glPopMatrix();
                          gl.glPopMatrix();
                      }
                      void drawCube(GL10 gl,float sx,float sy,float sz,float r,float g,float b){gl.glColor4f(r,g,b,1); gl.glPushMatrix(); gl.glScalef(sx,sy,sz); gl.glEnableClientState(GL10.GL_VERTEX_ARRAY); gl.glVertexPointer(3,GL10.GL_FLOAT,0,buf); for(int i=0;i<6;i++) gl.glDrawArrays(GL10.GL_TRIANGLE_STRIP,i*4,4); gl.glDisableClientState(GL10.GL_VERTEX_ARRAY); gl.glPopMatrix();}
                  });

                  hud = new TextView(this){public boolean onTouchEvent(MotionEvent e){float x=e.getX(),y=e.getY(),w=getWidth(),h=getHeight(); boolean d=e.getAction()!=MotionEvent.ACTION_UP; gas=d&&x<w*0.33f&&y<h*0.5f; brake=d&&x<w*0.33f&&y>=h*0.5f; left=d&&x>w*0.67f&&x<w*0.835f; right=d&&x>=w*0.835f; return true;}};
                  hud.setText("GTA NIGHT v1.2\n0 KM/H"); hud.setTextColor(Color.WHITE); hud.setTextSize(11); hud.setPadding(20,20,20,20); hud.setShadowLayer(4,2,2,Color.BLACK);
                  FrameLayout l=new FrameLayout(this); l.addView(glView); l.addView(hud); setContentView(l);
              }
          }
          ENDOFFILE
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: 8.4 }
      - run: |
          rm -rf gradlew gradle/wrapper
          gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: GTA-NIGHT-POLICE-v1.2, path: app/build/outputs/apk/debug/*.apk }
