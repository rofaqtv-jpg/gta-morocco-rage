name: Build GTA RAGE
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: android-actions/setup-android@v4
      - name: Create Project
        run: |
          mkdir -p app/src/main/java/com/turrinistudio/gtav
          mkdir -p app/src/main/res/values
          cat > gradle.properties << 'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          EOF
          cat > settings.gradle.kts << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "GTA Morocco"
          include(":app")
          EOF
          cat > build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF
          cat > app/build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.turrinistudio.gtav"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.turrinistudio.gtav"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 3
                  versionName = "0.3-FIXED"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
          }
          EOF
          cat > app/src/main/res/values/themes.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.GTA" parent="android:Theme.Material.Light.NoActionBar" />
          </resources>
          EOF
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:label="GTA Morocco" android:theme="@style/Theme.GTA">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/turrinistudio/gtav/MainActivity.kt << 'EOF'
          package com.turrinistudio.gtav
          import android.os.Bundle
          import android.widget.TextView
          import androidx.appcompat.app.AppCompatActivity
          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val tv = TextView(this)
                  tv.text = "GTA MOROCCO\n\nRAGE Private Build\nTangier 2026\n\nWORKS!"
                  tv.textSize = 26f
                  tv.setPadding(40, 400, 40, 40)
                  tv.textAlignment = TextView.TEXT_ALIGNMENT_CENTER
                  setContentView(tv)
              }
          }
          EOF
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4
      - name: Build APK
        run: |
          rm -rf gradlew gradle/wrapper
          gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: GTA-APK-WORKS
          path: app/build/outputs/apk/debug/*.apk
