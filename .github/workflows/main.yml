name: Build GTA RAGE
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin' }
      - uses: android-actions/setup-android@v4
      - name: Create GTA Playable
        run: |
          mkdir -p app/src/main/java/com/turrinistudio/gtav
          cat > settings.gradle.kts << 'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "GTA Morocco"
          include(":app")
          EOF
          cat > build.gradle.kts << 'EOF'
          plugins { id("com.android.application") version "8.2.2" apply false }
          EOF
          cat > app/build.gradle.kts << 'EOF'
          plugins { id("com.android.application") }
          android {
              namespace = "com.turrinistudio.gtav"
              compileSdk = 33
              defaultConfig {
                  applicationId = "com.turrinistudio.gtav"
                  minSdk = 21
                  targetSdk = 33
                  versionCode = 6
                  versionName = "0.6-Drive"
              }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:label="GTA Morocco" android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                  <activity android:name=".MainActivity" android:exported="true" android:screenOrientation="landscape">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/turrinistudio/gtav/MainActivity.java << 'EOF'
          package com.turrinistudio.gtav;
          import android.app.Activity;
          import android.opengl.GLSurfaceView;
          import android.os.Bundle;
          import android.widget.FrameLayout;
          import android.widget.TextView;
          import android.view.MotionEvent;
          import android.view.View;
          import javax.microedition.khronos.egl.EGLConfig;
          import javax.microedition.khronos.opengles.GL10;
          import java.nio.ByteBuffer;
          import java.nio.ByteOrder;
          import java.nio.FloatBuffer;

          public class MainActivity extends Activity {
              float carX = 0, carZ = 0, carRot = 0, speed = 0;
              boolean up=false, down=false, left=false, right=false;

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  GLSurfaceView glView = new GLSurfaceView(this);
                  glView.setRenderer(new GLSurfaceView.Renderer() {
                      FloatBuffer cube;
                      public void onSurfaceCreated(GL10 gl, EGLConfig c) {
                          gl.glClearColor(0.15f, 0.45f, 0.85f, 1f);
                          gl.glEnable(GL10.GL_DEPTH_TEST);
                          float[] v = { -0.5f,-0.5f,-0.5f, 0.5f,-0.5f,-0.5f, 0.5f,0.5f,-0.5f, -0.5f,0.5f,-0.5f, -0.5f,-0.5f,0.5f, 0.5f,-0.5f,0.5f, 0.5f,0.5f,0.5f, -0.5f,0.5f,0.5f };
                          ByteBuffer bb = ByteBuffer.allocateDirect(v.length*4);
                          bb.order(ByteOrder.nativeOrder());
                          cube = bb.asFloatBuffer();
                          cube.put(v); cube.position(0);
                      }
                      public void onSurfaceChanged(GL10 gl, int w, int h) {
                          gl.glViewport(0,0,w,h);
                          gl.glMatrixMode(GL10.GL_PROJECTION);
                          gl.glLoadIdentity();
                          float ratio = (float)w/h;
                          gl.glFrustumf(-ratio, ratio, -1, 1, 2, 20);
                      }
                      public void onDrawFrame(GL10 gl) {
                          gl.glClear(GL10.GL_COLOR_BUFFER_BIT | GL10.GL_DEPTH_BUFFER_BIT);
                          // Update car physics
                          if(up) speed += 0.01f;
                          if(down) speed -= 0.01f;
                          if(left) carRot += 2f;
                          if(right) carRot -= 2f;
                          speed *= 0.98f;
                          carX += Math.sin(Math.toRadians(carRot)) * speed;
                          carZ += Math.cos(Math.toRadians(carRot)) * speed;

                          gl.glMatrixMode(GL10.GL_MODELVIEW);
                          gl.glLoadIdentity();
                          gl.glTranslatef(0, -1.5f, -8);
                          gl.glRotatef(20,1,0,0);
                          gl.glTranslatef(-carX, 0, -carZ);

                          // Ground
                          gl.glPushMatrix();
                          gl.glTranslatef(0,-1f,0);
                          gl.glScalef(50,0.1f,50);
                          gl.glColor4f(0.2f,0.2f,0.2f,1);
                          drawCube(gl);
                          gl.glPopMatrix();

                          // Car
                          gl.glPushMatrix();
                          gl.glTranslatef(carX, 0, carZ);
                          gl.glRotatef(carRot,0,1,0);
                          gl.glScalef(1,0.6f,2);
                          gl.glColor4f(0.9f,0.1f,0.1f,1);
                          drawCube(gl);
                          gl.glPopMatrix();
                      }
                      void drawCube(GL10 gl){
                          gl.glEnableClientState(GL10.GL_VERTEX_ARRAY);
                          gl.glVertexPointer(3, GL10.GL_FLOAT, 0, cube);
                          gl.glDrawArrays(GL10.GL_TRIANGLE_FAN, 0, 4);
                          gl.glDrawArrays(GL10.GL_TRIANGLE_FAN, 4, 4);
                          gl.glDisableClientState(GL10.GL_VERTEX_ARRAY);
                      }
                  });

                  // Controls overlay
                  TextView controls = new TextView(this){
                      @Override
                      public boolean onTouchEvent(MotionEvent e){
                          float x = e.getX();
                          float y = e.getY();
                          float w = getWidth();
                          float h = getHeight();
                          boolean touch = e.getAction()!= MotionEvent.ACTION_UP;
                          up = touch && x < w*0.25f && y < h*0.5f;
                          down = touch && x < w*0.25f && y > h*0.5f;
                          left = touch && x > w*0.75f && y > h*0.5f && x < w*0.875f;
                          right = touch && x > w*0.875f && y > h*0.5f;
                          return true;
                      }
                  };
                  controls.setText("GTA MOROCCO v0.6\nSpeed: tap left side to drive\nTurn: tap right side\n\n[◀ GAS] [BRAKE ▶] [◀◀] [▶▶]\nTangier RAGE Engine");
                  controls.setTextColor(0xFFFFFFFF);
                  controls.setTextSize(12);
                  controls.setPadding(20,20,20,20);

                  FrameLayout layout = new FrameLayout(this);
                  layout.addView(glView);
                  layout.addView(controls);
                  setContentView(layout);
              }
          }
          EOF
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: 8.4 }
      - run: |
          rm -rf gradlew gradle/wrapper
          gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: GTA-DRIVEABLE, path: app/build/outputs/apk/debug/*.apk }
