name: Build GTA RAGE
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin' }
      - uses: android-actions/setup-android@v4
      - name: Create GTA v0.9 Collision
        run: |
          mkdir -p app/src/main/java/com/turrinistudio/gtav
          cat > settings.gradle.kts << 'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "GTA Morocco"
          include(":app")
          EOF
          cat > build.gradle.kts << 'EOF'
          plugins { id("com.android.application") version "8.2.2" apply false }
          EOF
          cat > app/build.gradle.kts << 'EOF'
          plugins { id("com.android.application") }
          android {
              namespace = "com.turrinistudio.gtav"
              compileSdk = 33
              defaultConfig {
                  applicationId = "com.turrinistudio.gtav"
                  minSdk = 21
                  targetSdk = 33
                  versionCode = 9
                  versionName = "0.9-Collision"
              }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:label="GTA Morocco" android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                  <activity android:name=".MainActivity" android:exported="true" android:screenOrientation="landscape">
                      <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/turrinistudio/gtav/MainActivity.java << 'ENDOFFILE'
          package com.turrinistudio.gtav;
          import android.app.Activity;
          import android.opengl.GLSurfaceView;
          import android.os.Bundle;
          import android.widget.FrameLayout;
          import android.widget.TextView;
          import android.view.MotionEvent;
          import javax.microedition.khronos.egl.EGLConfig;
          import javax.microedition.khronos.opengles.GL10;
          import java.nio.ByteBuffer;
          import java.nio.ByteOrder;
          import java.nio.FloatBuffer;
          import java.util.ArrayList;
          import java.util.List;

          public class MainActivity extends Activity {
              float carX=0, carZ=0, carRot=0, speed=0;
              boolean gas=false, brake=false, left=false, right=false;
              List<float[]> buildings = new ArrayList<>();

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  // Generate buildings list for collision
                  buildings.clear();
                  for(int i=-5;i<=5;i++){
                      for(int j=-5;j<=5;j++){
                          if(i==0 && j==0) continue;
                          buildings.add(new float[]{i*8, j*8, 2.5f});
                      }
                  }

                  GLSurfaceView glView = new GLSurfaceView(this);
                  glView.setRenderer(new GLSurfaceView.Renderer() {
                      FloatBuffer buf;
                      public void onSurfaceCreated(GL10 gl, EGLConfig c) {
                          gl.glClearColor(0.33f, 0.71f, 0.98f, 1f); // Tangier sky
                          gl.glEnable(GL10.GL_DEPTH_TEST);
                          float[] v = {
                              -0.5f,-0.5f,0.5f, 0.5f,-0.5f,0.5f, -0.5f,0.5f,0.5f, 0.5f,0.5f,0.5f,
                              0.5f,-0.5f,-0.5f, -0.5f,-0.5f,-0.5f, 0.5f,0.5f,-0.5f, -0.5f,0.5f,-0.5f,
                              -0.5f,-0.5f,-0.5f, -0.5f,-0.5f,0.5f, -0.5f,0.5f,-0.5f, -0.5f,0.5f,0.5f,
                              0.5f,-0.5f,0.5f, 0.5f,-0.5f,-0.5f, 0.5f,0.5f,0.5f, 0.5f,0.5f,-0.5f,
                              -0.5f,0.5f,0.5f, 0.5f,0.5f,0.5f, -0.5f,0.5f,-0.5f, 0.5f,0.5f,-0.5f,
                              -0.5f,-0.5f,-0.5f, 0.5f,-0.5f,-0.5f, -0.5f,-0.5f,0.5f, 0.5f,-0.5f,0.5f
                          };
                          ByteBuffer bb = ByteBuffer.allocateDirect(v.length*4);
                          bb.order(ByteOrder.nativeOrder());
                          buf = bb.asFloatBuffer(); buf.put(v); buf.position(0);
                      }
                      public void onSurfaceChanged(GL10 gl, int w, int h) {
                          gl.glViewport(0,0,w,h);
                          gl.glMatrixMode(GL10.GL_PROJECTION);
                          gl.glLoadIdentity();
                          gl.glFrustumf(-(float)w/h, (float)w/h, -1, 1, 1.5f, 100);
                      }
                      public void onDrawFrame(GL10 gl) {
                          float nextSpeed = speed;
                          if(gas) nextSpeed+=0.015f;
                          if(brake) nextSpeed-=0.025f;
                          if(left) carRot+=2.8f;
                          if(right) carRot-=2.8f;
                          if(nextSpeed>0.45f) nextSpeed=0.45f;
                          if(nextSpeed<-0.25f) nextSpeed=-0.25f;
                          nextSpeed*=0.988f;

                          float nextX = carX + (float)Math.sin(Math.toRadians(carRot))*nextSpeed;
                          float nextZ = carZ + (float)Math.cos(Math.toRadians(carRot))*nextSpeed;

                          boolean collide = false;
                          for(float[] bld : buildings){
                              float dx = nextX - bld[0];
                              float dz = nextZ - bld[1];
                              if(Math.abs(dx) < (bld[2]/2+1.2f) && Math.abs(dz) < (bld[2]/2+1.2f)){
                                  collide = true; break;
                              }
                          }
                          if(!collide){ carX=nextX; carZ=nextZ; speed=nextSpeed; }
                          else { speed *= -0.3f; }

                          gl.glClear(GL10.GL_COLOR_BUFFER_BIT|GL10.GL_DEPTH_BUFFER_BIT);
                          gl.glMatrixMode(GL10.GL_MODELVIEW);
                          gl.glLoadIdentity();
                          gl.glTranslatef(0, -2.5f, -14);
                          gl.glRotatef(28,1,0,0);
                          gl.glRotatef(-carRot,0,1,0);
                          gl.glTranslatef(-carX, 0, -carZ);

                          gl.glPushMatrix(); gl.glTranslatef(0,-0.5f,0);
                          drawCube(gl, 120,0.3f,120, 0.22f,0.22f,0.22f); gl.glPopMatrix();
                          gl.glPushMatrix(); gl.glTranslatef(0,-0.34f,0);
                          drawCube(gl, 0.6f,0.02f,120, 1f,0.9f,0.1f); gl.glPopMatrix();

                          for(float[] bld : buildings){
                              float h = 3 + (Math.abs(bld[0]+bld[1])%4);
                              gl.glPushMatrix();
                              gl.glTranslatef(bld[0], h/2-0.5f, bld[1]);
                              // Tangier white-blue buildings
                              float shade = 0.9f + (bld[0]%2)*0.05f;
                              drawCube(gl, bld[2], h, bld[2], shade, shade, 0.92f);
                              gl.glPopMatrix();
                          }

                          gl.glPushMatrix();
                          gl.glTranslatef(carX, 0.25f, carZ);
                          gl.glRotatef(carRot,0,1,0);
                          drawCube(gl, 1.3f,0.55f,2.4f, 0.95f,0.08f,0.08f);
                          gl.glPushMatrix(); gl.glTranslatef(0,0.5f,-0.15f); drawCube(gl, 1.1f,0.45f,1.1f, 0.15f,0.15f,0.25f); gl.glPopMatrix();
                          gl.glPushMatrix(); gl.glTranslatef(-0.7f,-0.35f,0.8f); drawCube(gl,0.25f,0.35f,0.5f,0.05f,0.05f,0.05f); gl.glPopMatrix();
                          gl.glPushMatrix(); gl.glTranslatef(0.7f,-0.35f,0.8f); drawCube(gl,0.25f,0.35f,0.5f,0.05f,0.05f,0.05f); gl.glPopMatrix();
                          gl.glPushMatrix(); gl.glTranslatef(-0.7f,-0.35f,-0.8f); drawCube(gl,0.25f,0.35f,0.5f,0.05f,0.05f,0.05f); gl.glPopMatrix();
                          gl.glPushMatrix(); gl.glTranslatef(0.7f,-0.35f,-0.8f); drawCube(gl,0.25f,0.35f,0.5f,0.05f,0.05f,0.05f); gl.glPopMatrix();
                          gl.glPopMatrix();
                      }
                      void drawCube(GL10 gl, float sx, float sy, float sz, float r, float g, float b){
                          gl.glColor4f(r,g,b,1);
                          gl.glPushMatrix(); gl.glScalef(sx, sy, sz);
                          gl.glEnableClientState(GL10.GL_VERTEX_ARRAY);
                          gl.glVertexPointer(3, GL10.GL_FLOAT, 0, buf);
                          for(int i=0;i<6;i++) gl.glDrawArrays(GL10.GL_TRIANGLE_STRIP, i*4, 4);
                          gl.glDisableClientState(GL10.GL_VERTEX_ARRAY);
                          gl.glPopMatrix();
                      }
                  });

                  TextView hud = new TextView(this){
                      public boolean onTouchEvent(MotionEvent e){
                          float x=e.getX(), y=e.getY(), w=getWidth(), h=getHeight();
                          boolean down=e.getAction()!=MotionEvent.ACTION_UP;
                          gas = down && x < w*0.3f && y < h*0.6f;
                          brake = down && x < w*0.3f && y >= h*0.6f;
                          left = down && x > w*0.7f && x < w*0.85f;
                          right = down && x >= w*0.85f;
                          return true;
                      }
                  };
                  hud.setText("GTA MOROCCO v0.9\nCOLLISION ON - Tangier\n[GAS] top-left [BRAKE] bottom-left\nTurn -> right side");
                  hud.setTextColor(0xFFFFFFFF);
                  hud.setTextSize(11);
                  hud.setPadding(20,20,20,20);

                  FrameLayout layout=new FrameLayout(this);
                  layout.addView(glView); layout.addView(hud);
                  setContentView(layout);
              }
          }
          ENDOFFILE
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: 8.4 }
      - run: |
          rm -rf gradlew gradle/wrapper
          gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: GTA-0.9-Collision, path: app/build/outputs/apk/debug/*.apk }
