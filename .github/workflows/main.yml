name: Build GTA v634 MINIMAL
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin' }
      - uses: android-actions/setup-android@v4
      - uses: nttld/setup-ndk@v1
        with: { ndk-version: r25b }
      - name: Create MINIMAL BUILD
        run: |
          rm -rf app
          mkdir -p app/src/main/java/com/turrinistudio/gtav
          cat > settings.gradle << 'EOF'
          include ':app'
          EOF
          cat > build.gradle << 'EOF'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF
          cat > app/build.gradle << 'EOF'
          apply plugin: 'com.android.application'
          android {
              compileSdkVersion 34
              defaultConfig {
                  applicationId "com.turrinistudio.gtav"
                  minSdkVersion 21
                  targetSdkVersion 34
                  versionCode 634
                  versionName "6.34-MINIMAL"
                  ndk { abiFilters "arm64-v8a" }
              }
              namespace 'com.turrinistudio.gtav'
          }
          EOF
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:label="GTA Tangier" android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                  <activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity>
              </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/turrinistudio/gtav/MainActivity.java << 'ENDOFFILE'
          package com.turrinistudio.gtav;
          import android.app.Activity;
          import android.opengl.GLSurfaceView;
          import android.os.Bundle;
          public class MainActivity extends Activity {
              @Override protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  GLSurfaceView v = new GLSurfaceView(this);
                  v.setRenderer(new GLSurfaceView.Renderer() {
                      public void onSurfaceCreated(javax.microedition.khronos.opengles.GL10 gl, javax.microedition.khronos.egl.EGLConfig c) { gl.glClearColor(0.2f, 0.6f, 1f, 1f); }
                      public void onSurfaceChanged(javax.microedition.khronos.opengles.GL10 gl, int w, int h) { gl.glViewport(0, 0, w, h); }
                      public void onDrawFrame(javax.microedition.khronos.opengles.GL10 gl) { gl.glClear(16640); }
                  });
                  setContentView(v);
              }
          }
          ENDOFFILE
      - name: Build MINIMAL
        run: |
          rm -rf gradlew gradle/wrapper
          gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: GTA-v634-MINIMAL-SKY, path: app/build/outputs/apk/debug/*.apk }
