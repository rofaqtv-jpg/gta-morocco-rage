name: Build GTA RAGE
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin' }
      - uses: android-actions/setup-android@v4
      - name: Create GTA 3D
        run: |
          mkdir -p app/src/main/java/com/turrinistudio/gtav
          cat > settings.gradle.kts << 'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "GTA Morocco"
          include(":app")
          EOF
          cat > build.gradle.kts << 'EOF'
          plugins { id("com.android.application") version "8.2.2" apply false }
          EOF
          cat > app/build.gradle.kts << 'EOF'
          plugins { id("com.android.application") }
          android {
              namespace = "com.turrinistudio.gtav"
              compileSdk = 33
              defaultConfig {
                  applicationId = "com.turrinistudio.gtav"
                  minSdk = 21
                  targetSdk = 33
                  versionCode = 5
                  versionName = "0.5-3D"
              }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:label="GTA Morocco">
                  <activity android:name=".MainActivity" android:exported="true" android:screenOrientation="landscape">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/turrinistudio/gtav/MainActivity.java << 'EOF'
          package com.turrinistudio.gtav;
          import android.app.Activity;
          import android.opengl.GLSurfaceView;
          import android.os.Bundle;
          import android.widget.FrameLayout;
          import android.widget.TextView;
          import android.view.Gravity;
          import javax.microedition.khronos.egl.EGLConfig;
          import javax.microedition.khronos.opengles.GL10;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);

                  GLSurfaceView glView = new GLSurfaceView(this);
                  glView.setRenderer(new GLSurfaceView.Renderer() {
                      float angle = 0;
                      public void onSurfaceCreated(GL10 gl, EGLConfig c) {
                          gl.glClearColor(0.05f, 0.2f, 0.4f, 1.0f); // لون سماء طنجة
                      }
                      public void onSurfaceChanged(GL10 gl, int w, int h) {
                          gl.glViewport(0,0,w,h);
                      }
                      public void onDrawFrame(GL10 gl) {
                          gl.glClear(GL10.GL_COLOR_BUFFER_BIT);
                          angle += 0.5f;
                      }
                  });

                  TextView hud = new TextView(this);
                  hud.setText("GTA MOROCCO RAGE\nTANGIER - Private Build\n[W] [A] [S] [D] - Drive\n\nEngine: OpenGL ES - OK");
                  hud.setTextColor(0xFFFFFFFF);
                  hud.setTextSize(14);
                  hud.setPadding(20,20,20,20);

                  FrameLayout layout = new FrameLayout(this);
                  layout.addView(glView);
                  layout.addView(hud);
                  setContentView(layout);
              }
          }
          EOF
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: 8.4 }
      - run: |
          rm -rf gradlew gradle/wrapper
          gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: GTA-3D-ENGINE, path: app/build/outputs/apk/debug/*.apk }
