name: Build GTA RAGE
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin' }
      - uses: android-actions/setup-android@v4
      - uses: nttld/setup-ndk@v1
        with: { ndk-version: r26d, link-to-sdk: true }
      - name: Create Project
        run: |
          mkdir -p app/src/main/cpp/rage app/src/main/cpp/physics app/src/main/cpp/scripting app/src/main/java/com/turrinistudio/gtav
          cat > gradle.properties << 'EOF'
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx4g
          EOF
          cat > settings.gradle.kts << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "GTA Morocco"
          include(":app")
          EOF
          cat > build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF
          cat > app/build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.turrinistudio.gtav"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.turrinistudio.gtav"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "0.1"
                  externalNativeBuild {
                      cmake {
                          cppFlags += "-std=c++17"
                      }
                  }
              }
              externalNativeBuild {
                  cmake {
                      path = file("src/main/cpp/CMakeLists.txt")
                      version = "3.22.1"
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("com.google.android.material:material:1.11.0")
          }
          EOF
          cat > app/src/main/cpp/CMakeLists.txt << 'EOF'
          cmake_minimum_required(VERSION 3.22.1)
          project("gta_morocco")
          add_library(gta_morocco SHARED game_main.cpp rage/rage_core.cpp physics/physics_world.cpp scripting/lua_bridge.cpp)
          find_library(log-lib log)
          target_link_libraries(gta_morocco ${log-lib} android)
          EOF
          cat > app/src/main/cpp/game_main.cpp << 'EOF'
          #include <jni.h>
          extern "C" JNIEXPORT jstring JNICALL Java_com_turrinistudio_gtav_MainActivity_stringFromJNI(JNIEnv* env, jobject) { return env->NewStringUTF("GTA Morocco RAGE OK"); }
          EOF
          echo '#pragma once
          namespace RAGE { class Core { public: static void Init(); }; }' > app/src/main/cpp/rage/rage_core.h
          echo '#include "rage_core.h"
          namespace RAGE { void Core::Init() {} }' > app/src/main/cpp/rage/rage_core.cpp
          echo 'class PhysicsWorld{};' > app/src/main/cpp/physics/physics_world.cpp
          echo 'int lua_mission_start(const char* n){return 0;}' > app/src/main/cpp/scripting/lua_bridge.cpp
          cat > app/src/main/java/com/turrinistudio/gtav/MainActivity.kt << 'EOF'
          package com.turrinistudio.gtav
          import android.os.Bundle
          import androidx.appcompat.app.AppCompatActivity
          import android.widget.TextView
          class MainActivity : AppCompatActivity() {
              external fun stringFromJNI(): String
              companion object { init { System.loadLibrary("gta_morocco") } }
              override fun onCreate(s: Bundle?) { super.onCreate(s); val tv = TextView(this); tv.text = stringFromJNI(); tv.textSize = 24f; setContentView(tv) }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?><manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:label="GTA Morocco"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>
          EOF
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: 8.4 }
      - run: |
          rm -rf gradlew gradle/wrapper
          gradle assembleDebug --info
      - uses: actions/upload-artifact@v4
        with: { name: GTA-APK, path: '**/*.apk' }
